name: release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - name: Verify tag matches manifest version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(node -p "require('./src/manifest.base.json').version")
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version ${MANIFEST_VERSION}" >&2
            exit 1
          fi
          echo "VERSION=${TAG_VERSION}" >> "$GITHUB_ENV"
      - name: Build
        run: |
          npm run build:chrome
          npm run build:firefox
      # Zip from inside each build dir so manifest.json sits at the archive
      # root — Firefox Add-ons rejects a wrapping folder ("manifest.json
      # was not found"). The Chrome Web Store tolerates one, but both zips
      # use the same layout.
      - name: Package
        run: |
          (cd dist/chrome && zip -r "$GITHUB_WORKSPACE/pencil-nu-chrome-${VERSION}.zip" .)
          (cd dist/firefox && zip -r "$GITHUB_WORKSPACE/pencil-nu-firefox-${VERSION}.zip" .)
          for t in chrome firefox; do
            unzip -l "pencil-nu-${t}-${VERSION}.zip" | awk '{print $4}' | grep -qx manifest.json
          done
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pencil-nu-chrome-${{ env.VERSION }}.zip
            pencil-nu-firefox-${{ env.VERSION }}.zip
          generate_release_notes: true
