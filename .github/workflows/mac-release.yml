name: mac-release
# Builds the Mac app, signs it with the Developer ID certificate, has Apple
# notarize it, and attaches Pencil.dmg to a GitHub Release. Runs on tags like
# mac-v0.1.0 (the extension's own releases use plain v* tags).
on:
  push:
    tags:
      - "mac-v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm ci
        working-directory: mobile
      - name: Verify tag matches the app version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#mac-v}"
          APP_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" mobile/mac/Info.plist)
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match app version ${APP_VERSION}" >&2
            exit 1
          fi
      - name: Install the signing certificate
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"
          xcrun notarytool store-credentials pencil \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
      - name: Build, sign and notarize
        run: ./mac/build.sh release
        working-directory: mobile
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/mac/build/Pencil.dmg
          generate_release_notes: true
