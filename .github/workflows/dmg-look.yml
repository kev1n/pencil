name: dmg-look
# Temporary: shows how the Mac disk image's window looks in Finder.
on:
  pull_request:
    paths:
      - "mobile/mac/dmg-*"
      - ".github/workflows/dmg-look.yml"
jobs:
  look:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - working-directory: mobile
        run: |
          mkdir -p mac/build/Pencil.app/Contents/Resources mac/build/Pencil.app/Contents/MacOS
          cp mac/Info.plist mac/build/Pencil.app/Contents/Info.plist
          cp mac/AppIcon.icns mac/build/Pencil.app/Contents/Resources/AppIcon.icns
          printf '#!/bin/sh\n' > mac/build/Pencil.app/Contents/MacOS/Pencil && chmod +x mac/build/Pencil.app/Contents/MacOS/Pencil
          python3 -m venv /tmp/tools && /tmp/tools/bin/pip install --quiet dmgbuild==1.6.7
          /tmp/tools/bin/dmgbuild -s mac/dmg-settings.py -D app=mac/build/Pencil.app Pencil /tmp/Pencil.dmg
          mkdir /tmp/looks
          for dark in false true; do
            osascript -e "tell application \"System Events\" to tell appearance preferences to set dark mode to $dark"
            sleep 3
            open /tmp/Pencil.dmg
            sleep 8
            screencapture -x "/tmp/looks/dark-$dark.png"
            hdiutil detach /Volumes/Pencil -force || true
            sleep 2
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-looks
          path: /tmp/looks
